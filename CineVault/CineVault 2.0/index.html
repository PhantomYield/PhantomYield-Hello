<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVault - Your Movie Vault</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:white;padding:20px}
body.light{background:#f5f5f5;color:#111}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:20px}
h1{font-size:32px} h1 span{color:#ff3d68}
input{padding:12px 15px;border-radius:25px;border:none;width:280px;outline:none}
button{padding:10px 18px;border-radius:20px;border:none;background:#ff3d68;color:white;cursor:pointer;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.card{background:#1e1e30;border-radius:15px;overflow:hidden;padding-bottom:12px}
body.light .card{background:white;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.card img{width:100%;height:300px;object-fit:cover;background:#333}
.card h3{padding:10px 10px 0;font-size:17px}
.card p{padding:5px 10px;font-size:13px;opacity:.8}
.badge{display:inline-block;background:#ff3d68;color:white;padding:3px 8px;border-radius:10px;font-size:12px;margin:5px 10px}
</style>
</head>
<body>
<header>
<div><h1>🎬 Cine<span>Vault</span></h1><p>Your personal movie collection</p></div>
<input id="search" placeholder="🔍 Search movies..." oninput="searchMovie()">
<button onclick="toggleDark()">🌙 Dark / Light</button>
</header>
<div class="grid" id="grid"></div>

<script>
const movies=[
{title:"The Princess and the Frog",year:2009,category:"Animated",rating:7.1,poster:"https://upload.wikimedia.org/wikipedia/en/8/81/The_Princess_and_the_Frog_poster.jpg",description:"A princess, a dream and a little magic."},
https://upload.wikimedia.org/wikipedia/en/2/2a/Enchantedposter.jpg
{title:"Moana",year:2016,category:"Animated",rating:7.6,poster:"https://upload.wikimedia.org/wikipedia/en/2/26/Moana_Teaser_Poster.jpg",description:"A brave girl sails to save her island."},
{title:"Frozen",year:2013,category:"Animated",rating:7.2,poster:"https://upload.wikimedia.org/wikipedia/en/0/05/Frozen_%282013_film%29_poster.jpg",description:"Two sisters, one frozen kingdom."},
https://upload.wikimedia.org/wikipedia/en/9/98/Coco_%282017_film%29_poster.jpg
{title:"Toy Story",year:1995,category:"Animated",rating:8.3,poster:"https://upload.wikimedia.org/wikipedia/en/1/13/Toy_Story.jpg",description:"Toys come to life when no one is looking."},
{title:"Finding Nemo",year:2003,category:"Animated",rating:8.2,poster:"https://upload.wikimedia.org/wikipedia/en/a/a2/Finding_Nemo.jpg",description:"A dad crosses the ocean to find his son."},
{title:"Shrek",year:2001,category:"Animated",rating:8.2,poster:"https://upload.wikimedia.org/wikipedia/en/7/7b/Shrek_%282001_animated_feature_film%29.jpg",description:"An ogre, a donkey and a rescue mission."},
{title:"The Lion King",year:1994,category:"Animated",rating:8.5,poster:"https://upload.wikimedia.org/wikipedia/en/3/3d/The_Lion_King_poster.jpg",description:"Simba must take his place as king."},
https://i.pinimg.com/originals/5e/d6/72/5ed672311f067ddfc5ea3cba16504d9b.jpg{title:"Tangled",year:2010,category:"Animated",rating:7.7,poster:"
https://upload.wikimedia.org/wikipedia/en/a/a8/Tangled_poster.jpg",description:"Rapunzel escapes her tower."},
{title:"Inside Out",year:2015,category:"Animated",rating:8.1,poster:"https://upload.wikimedia.org/wikipedia/en/0/0a/Inside_Out_%282015_film%29_poster.jpg",description:"Emotions inside a girl's mind."},
{title:"Up",year:2009,category:"Animated",rating:8.3,poster:"https://upload.wikimedia.org/wikipedia/en/0/05/Up_%282009_film%29.jpg",description:"A house flies away with balloons."},
{title:"Ratatouille",year:2007,category:"Animated",rating:8.0,poster:"https://upload.wikimedia.org/wikipedia/en/5/50/RatatouillePoster.jpg",description:"A rat who wants to be a chef."},
https://image.tmdb.org/t/p/w500/esbfojkHBEyMlIcv2VGW3fCzlzH.jpg
{title:"Brave",year:2012,category:"Animated",rating:7.1,poster:"https://image.tmdb.org/t/p/w500/jQpjIr4W4U8f5C8YPouDAcHoVuE.jpg,description:{"A princess fights for her freedom."},
{title:"How to Train Your Dragon",year:2010,category:"Animated",rating:8.1,poster:"https://upload.wikimedia.org/wikipedia/en/9/99/How_to_Train_Your_Dragon_Poster.jpg",description:"A boy befriends a dragon."},
{title:"Spider-Man: Into the Spider-Verse",year:2018,category:"Animated",rating:8.4,poster:"https://image.tmdb.org/t/p/w500/5AxLiAVJ4qxGDqoudHKHQNCmCgd.jpg://upload.wikimedia.org/wikipedia/en/f/fb/Spider-Man_Into_the_Spider-Verse_poster.png",description:"Miles Morales becomes Spider-Man."}
];

function show(list){
document.getElementById("grid").innerHTML=list.map(m=>`
<div class="card">
<img src="${m.poster}" onerror="this.src='https://via.placeholder.com/300x450?text=${encodeURIComponent(m.title)}'">
<h3>${m.title}</h3>
<p>⭐ ${m.rating} • ${m.year}</p>
<span class="badge">${m.category}</span>
<p>${m.description}</p>
</div>`).join("");
}
function searchMovie(){
let q=document.getElementById("search").value.toLowerCase();
show(movies.filter(m=>m.title.toLowerCase().includes(q)));
}
function toggleDark(){document.body.classList.toggle("light");}
show(movies);
</script>
</body>
</html>

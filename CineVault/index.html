<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineVault - Every movie has a home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f8f9ff;color:#222;padding:20px}
body.dark{background:#12121c;color:#fff}
header{max-width:1100px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:32px;font-weight:900;color:#4a4de6}
.logo span{font-size:14px;font-weight:400;color:#888;display:block}
button{cursor:pointer;border:0;border-radius:999px;padding:10px 18px;font-weight:700}
.dark-btn{background:#aab0ff;color:#222}
.controls{max-width:1100px;margin:0 auto 20px;display:flex;gap:10px;flex-wrap:wrap}
.controls input,.controls select{padding:12px 16px;border:1px solid #ddd;border-radius:999px;flex:1;min-width:180px}
.grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.08)}
body.dark .card{background:#1e1e2e}
.card img{width:100%;height:270px;object-fit:cover;display:block;background:#ddd}
.card-body{padding:12px}
.card-body h3{font-size:16px;margin-bottom:4px}
.card-body p{font-size:13px;color:#777}
.badge{display:inline-block;background:#ffeef0;color:#d6336c;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;margin-top:8px}
footer{text-align:center;color:#999;margin-top:30px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">🎬 CineVault<span>Every movie has a home 💙</span></div>
<button class="dark-btn" onclick="document.body.classList.toggle('dark')">🌙 Dark Mode</button>
</header>
<div class="controls">
<input id="search" placeholder="🔍 Search for a movie..." oninput="render()">
<select id="cat" onchange="render()"><option value="All">All Categories</option><option value="Animated">Animated</option></select>
<select id="sort" onchange="render()"><option value="All">All Movies</option><option value="Top">Top Rated</option></select>
</div>
<div class="grid" id="grid"></div>
<footer>Curated with 💙 by CineVault</footer>
<script>
const movies=[
{title:"Moana",year:2016,category:"Animated",rating:7.6,poster:"https://image.tmdb.org/t/p/w500/4Iu5f2nv7huqJv1fTRK7M0R6T.jpg",desc:"A brave girl sails across the ocean to save her island."},
{title:"Mulan",year:1998,category:"Animated",rating:7.6,poster:"https://image.tmdb.org/t/p/w500/5TYgKxYd1Fh5YF0F.jpg",desc:"A brave young woman takes her father's place in the army."},
{title:"Brave",year:2012,category:"Animated",rating:7.1,poster:"https://image.tmdb.org/t/p/w500/jQpjIr4W4U8f5C8YPouDAcHoVuE.jpg",desc:"A Scottish princess must break a spell."},
{title:"Zootopia",year:2016,category:"Animated",rating:8.0,poster:"https://image.tmdb.org/t/p/w500/esbfojkHBEyMlIcv2VGW3fCzlzH.jpg",desc:"A bunny cop and a fox team up."},
{title:"Ratatouille",year:2007,category:"Animated",rating:8.0,poster:"https://image.tmdb.org/t/p/w500/t3vaWRPSYH8Sx9dXh9q7k8M61k.jpg",desc:"A rat who dreams of becoming a chef in Paris."},
{title:"Coco",year:2017,category:"Animated",rating:8.4,poster:"https://image.tmdb.org/t/p/w500/gGEsAgQTvD5YQ89bSx5MCRWnD5k.jpg",desc:"A boy journeys to the Land of the Dead."},
{title:"Tangled",year:2010,category:"Animated",rating:7.7,poster:"https://image.tmdb.org/t/p/w500/ym7Kst6a4uodryxO9nX0m3dFg.jpg",desc:"Rapunzel escapes her tower."},
{title:"Beauty and the Beast",year:1991,category:"Animated",rating:8.0,poster:"https://image.tmdb.org/t/p/w500/5ed6d2f66767dfc5ea3cba16504d9b.jpg",desc:"Belle falls for a prince trapped as a Beast."},
{title:"How to Train Your Dragon",year:2010,category:"Animated",rating:8.1,poster:"https://image.tmdb.org/t/p/w500/xvYxM7JcRCK2C5Q8vYhZ8sC1E.jpg",desc:"Hiccup befriends a Night Fury dragon."},
{title:"Spider-Man: Into the Spider-Verse",year:2018,category:"Animated",rating:8.4,poster:"https://image.tmdb.org/t/p/w500/5AxLiAVJ4qxGDqoudHKHQNCmCgd.jpg",desc:"Miles Morales becomes Spider-Man."},
{title:"Inside Out",year:2015,category:"Animated",rating:8.1,poster:"https://image.tmdb.org/t/p/w500/aAmfIX3TT40zUHVTuB7kV9HhC0H.jpg",desc:"Emotions inside a girl's mind go on an adventure."},
{title:"The Lion King",year:1994,category:"Animated",rating:8.5,poster:"https://image.tmdb.org/t/p/w500/sKCr78MXSLixwmZ8DyJLrpMsd15.jpg",desc:"Simba must reclaim his place as king."},
{title:"Up",year:2009,category:"Animated",rating:8.2,poster:"https://image.tmdb.org/t/p/w500/vpbaStTMt8qqXaEgnOR2EE4DNt.jpg",desc:"An old man flies his house to Paradise Falls."},
{title:"Toy Story",year:1995,category:"Animated",rating:8.3,poster:"https://image.tmdb.org/t/p/w500/uXDfjJbdP4ijW5hWSBrPrlKpx.jpg",desc:"Woody and Buzz learn to be friends."},
{title:"Finding Nemo",year:2003,category:"Animated",rating:8.1,poster:"https://image.tmdb.org/t/p/w500/eLxPgjSMPJQw5BZz2yE9y8Xz.jpg",desc:"A clownfish searches the ocean for his son."},
{title:"Shrek",year:2001,category:"Animated",rating:7.9,poster:"https://image.tmdb.org/t/p/w500/iBholKfT2G7a3P0h5YF0F.jpg",desc:"An ogre goes on a quest to save a princess."}
];
function render(){
let q=document.getElementById('search').value.toLowerCase();
let c=document.getElementById('cat').value;
let s=document.getElementById('sort').value;
let list=movies.filter(m=>(c==="All"||m.category===c)&&m.title.toLowerCase().includes(q));
if(s==="Top") list=list.slice().sort((a,b)=>b.rating-a.rating);
document.getElementById('grid').innerHTML=list.map(m=>'<div class="card"><img src="'+m.poster+'" alt="'+m.title+'"><div class="card-body"><h3>'+m.title+'</h3><p>'+m.year+' - ⭐ '+m.rating+'</p><p>'+m.desc+'</p><span class="badge">'+m.category+'</span></div></div>').join('');
}
render();
</script>
</body>
</html>
